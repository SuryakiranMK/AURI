<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURI · Listen Together</title>
  <meta name="description" content="Listen together in real-time on AURI Desktop Music Player">
  <meta property="og:title" content="Join Listen Together on AURI">
  <meta property="og:description" content="Click to sync playback in real-time on AURI Desktop.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#14161c">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1a162b 0%, #0d0f14 60%, #07080a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(20, 22, 28, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.15);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    p.sub {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .code-box {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #c4b5fd;
    }
    .copy-btn {
      background: rgba(139, 92, 246, 0.25);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .copy-btn:hover {
      background: rgba(139, 92, 246, 0.4);
      color: #fff;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: #8b5cf6;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      display: block;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      font-size: 13.5px;
      padding: 11px 20px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .status {
      font-size: 12px;
      color: #64748b;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">🎧</div>
    <h1>Listen Together on AURI</h1>
    <p class="sub">Your friend invited you to synchronize music in real-time with zero lag.</p>

    <div class="code-box">
      <span class="code-text" id="roomCode">...</span>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">Copy Code</button>
    </div>

    <a href="#" id="launchBtn" class="btn-primary">Open AURI Desktop</a>
    <a href="https://github.com/SuryakiranMK/AURI/releases" target="_blank" rel="noopener" class="btn-secondary">Don't have AURI? Download Free</a>

    <div class="status" id="statusText">Attempting to launch AURI Desktop...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const room = (params.get('room') || '').trim().toUpperCase();
    const valid = /^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{2}$/.test(room);

    const roomElem = document.getElementById('roomCode');
    const launchBtn = document.getElementById('launchBtn');
    const statusText = document.getElementById('statusText');

    if (valid) {
      roomElem.textContent = room;
      const uri = 'auri://join/' + encodeURIComponent(room);
      launchBtn.href = uri;

      // Auto-trigger protocol launch
      setTimeout(() => {
        window.location.href = uri;
      }, 250);

      setTimeout(() => {
        statusText.textContent = "If AURI didn't open automatically, click 'Open AURI Desktop' above.";
      }, 2500);
    } else {
      roomElem.textContent = "NO CODE";
      launchBtn.style.display = "none";
      statusText.textContent = "No valid room code found in URL. Enter room code in AURI directly.";
    }

    function copyCode() {
      if (!valid) return;
      navigator.clipboard.writeText(room).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = 'Copy Code'; }, 2000);
      });
    }
  </script>
</body>
</html>
