[package]
name = "auri"
version = "0.1.0"
edition = "2021"
authors = ["SuryakiranMK", "Antigravity"]
description = "A Minimalist, Ultra-Lightweight, Gaming-First Desktop Music Player"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
cpal = "0.18.2"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "vorbis", "wav", "pcm", "mkv", "opt-simd"] }
ringbuf = "0.6.0"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
