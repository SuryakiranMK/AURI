<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="50%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#28303F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="spectrumGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.70"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#06B6D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient audio glow -->
  <circle cx="256" cy="285" r="180" fill="url(#centerGlow)"/>

  <!-- Squircle Canvas (Continuous Curvature) -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="3.5"/>

  <!-- Top Glass Highlight -->
  <path d="M 130 30 Q 256 34 382 30" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Iconic AURI Apex & Equalizer Mark -->
  <g filter="url(#glyphShadow)">
    <!-- Outer Chevron "A" Structure -->
    <path d="
      M 256 100
      L 396 384
      L 334 384
      L 296 304
      L 216 304
      L 178 384
      L 116 384
      Z
      M 256 186
      L 232 254
      L 280 254
      Z
    " fill="url(#apexGrad)"/>

    <!-- 5-Bar Dynamic Audio Equalizer Spectrum -->
    <rect x="206" y="326" width="13" height="44" rx="6.5" fill="url(#spectrumGrad)"/>
    <rect x="226" y="306" width="13" height="64" rx="6.5" fill="url(#spectrumGrad)"/>
    <rect x="249.5" y="276" width="13" height="94" rx="6.5" fill="url(#spectrumGrad)"/>
    <rect x="273" y="306" width="13" height="64" rx="6.5" fill="url(#spectrumGrad)"/>
    <rect x="293" y="326" width="13" height="44" rx="6.5" fill="url(#spectrumGrad)"/>

    <!-- Apex Status Accent Indicator -->
    <circle cx="256" cy="136" r="6.5" fill="#34D399"/>
  </g>
</svg>