<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <!-- Hairline Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5568" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1E2330" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Vibrant AURI Soundwave Gradient: Electric Violet -> Indigo -> Cyan -> Emerald -->
    <linearGradient id="auriGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="38%" stop-color="#6366F1"/>
      <stop offset="72%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Subtle Ambient Violet-Cyan Glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Canvas (Continuous Curvature) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>
  <circle cx="256" cy="268" r="180" fill="url(#glow)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Iconic AURI Vector Soundwave Apex ('A') -->
  <g>
    <!-- Outer Chevron Legs -->
    <path d="M 130 396 L 256 106 L 382 396" fill="none" stroke="url(#auriGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Horizontal Crossbar -->
    <line x1="170" y1="278" x2="342" y2="278" stroke="url(#auriGrad)" stroke-width="36" stroke-linecap="round"/>

    <!-- Dynamic Audio Equalizer Spectrum Bars -->
    <!-- Left Inner Bar -->
    <rect x="194" y="212" width="28" height="88" rx="14" fill="url(#auriGrad)"/>

    <!-- Center Apex Bar -->
    <rect x="241" y="154" width="30" height="166" rx="15" fill="url(#auriGrad)"/>

    <!-- Right Inner Bar -->
    <rect x="290" y="212" width="28" height="88" rx="14" fill="url(#auriGrad)"/>
  </g>
</svg>
